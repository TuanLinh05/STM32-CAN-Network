<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Three-node CAN control network</title><desc id="desc">PC-to-master commands, sensor acquisition and motor-speed feedback</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087e89"/></marker></defs><rect width="1200" height="550" rx="20" fill="#f5f9fc"/><text x="40" y="55" fill="#193349" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">Three-node CAN control network</text><text x="40" y="90" fill="#52677c" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400">PC-to-master commands, sensor acquisition and motor-speed feedback</text><rect x="40" y="140" width="300" height="132" rx="16" fill="white" stroke="#cadbe8" stroke-width="2"/><path d="M56 140H324" stroke="#087e89" stroke-width="4"/><text x="60" y="175" fill="#193349" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">PC monitor</text><text x="60" y="209" fill="#52677c" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400">.NET 10 WinForms</text><text x="60" y="236" fill="#52677c" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400">Serial commands + plots</text><rect x="450" y="140" width="300" height="132" rx="16" fill="white" stroke="#cadbe8" stroke-width="2"/><path d="M466 140H734" stroke="#087e89" stroke-width="4"/><text x="470" y="175" fill="#193349" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">STM32H743 master</text><text x="470" y="209" fill="#52677c" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400">USART1 PB6 / PB7</text><text x="470" y="236" fill="#52677c" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400">FDCAN classic bridge</text><rect x="860" y="140" width="300" height="132" rx="16" fil